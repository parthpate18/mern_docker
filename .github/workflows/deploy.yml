name: CI-CD for MERN Stack App

on:
  push:
    branches:
      - main  # Triggers workflow on pushes to main branch

jobs:
  build-and-deploy:
    runs-on: [self-hosted, your-local-runner-tag]  # Adjust 'your-local-runner-tag' as needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Set appropriate Node.js version
  # Set appropriate Node.js version
  # Set appropriate Node.js version
  

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build the Application
        run: npm run build

      - name: Deploy to Local Server
        run: |
          # Example deployment script
          pm2 delete all || true
          pm2 start npm --name "app-name" -- start
